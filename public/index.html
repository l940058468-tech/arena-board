 <!doctype html>
 <html lang="zh-CN">
 <head>
   <meta charset="utf-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1" />
   <title>斗魂竞技场 · 全英雄胜率榜单</title>
   <link rel="stylesheet" href="/styles.css" />
 </head>
 <body>
   <header class="topbar">
     <div class="topbar-inner">
       <div class="topbar-left">
         <div class="brand">
           <span class="brand-icon">⚔</span>
           <div>
             <h1>斗魂竞技场</h1>
             <p class="brand-sub">全英雄胜率 &amp; 海克斯榜单</p>
           </div>
         </div>
         <span class="patch-badge" id="patchBadge">--</span>
       </div>
       <div class="topbar-right">
         <span class="updated-at" id="updatedAt">--</span>
         <button class="btn" id="refreshBtn" type="button">
           <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
           刷新数据
         </button>
       </div>
     </div>
   </header>
 
   <main>
     <section class="summary-band" aria-label="榜单概览">
       <div class="summary-item"><span class="summary-label">英雄数</span><strong id="championCount">--</strong></div>
       <div class="summary-item"><span class="summary-label">平均胜率</span><strong id="avgWr">--</strong></div>
       <div class="summary-item"><span class="summary-label">分析场次</span><strong id="analysedGames">--</strong></div>
       <div class="summary-item summary-source"><span class="summary-label">数据来源</span><a id="sourceLink" href="https://lolalytics.com/lol/tierlist/arena/" target="_blank" rel="noreferrer">lolalytics</a></div>
     </section>
 
     <div class="controls-bar" aria-label="筛选与排序">
       <label class="search-box">
         <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
         <input id="searchInput" type="search" placeholder="搜索英雄…" autocomplete="off" />
       </label>
       <span class="filter-divider"></span>
       <div class="sort-group" role="group" aria-label="排序方式">
         <button class="seg-btn is-active" data-sort="rank" type="button">综合</button>
         <button class="seg-btn" data-sort="wr" type="button">胜率</button>
         <button class="seg-btn" data-sort="pr" type="button">登场率</button>
         <button class="seg-btn" data-sort="games" type="button">场次</button>
       </div>
       <span class="filter-divider"></span>
       <div class="tier-filters" id="tierFilters" role="group" aria-label="段位筛选"></div>
     </div>
 
     <section class="board" aria-label="英雄榜单">
       <div class="table-wrap">
         <table class="champ-table">
           <thead>
             <tr>
               <th class="col-rank">排名</th>
               <th class="col-champ">英雄</th>
               <th class="col-tier">段位</th>
               <th class="col-wr">胜率</th>
               <th class="col-pr">登场率</th>
               <th class="col-games">场次</th>
               <th class="col-delta">胜率偏差</th>
               <th class="col-augment">白银海克斯</th>
               <th class="col-augment">黄金海克斯</th>
               <th class="col-augment">棱彩海克斯</th>
             </tr>
           </thead>
           <tbody id="champRows"></tbody>
         </table>
         <div class="empty-state" id="emptyState" hidden>没有匹配的英雄</div>
       </div>
       <div class="board-footer">
         <span>点击行查看全部海克斯强化详情</span>
         <span id="boardInfo"></span>
       </div>
     </section>
   </main>
 
   <aside class="drawer" id="drawer" aria-hidden="true">
     <div class="drawer-backdrop" data-close="1"></div>
     <div class="drawer-panel" role="dialog" aria-modal="true" aria-label="英雄详情">
       <button class="drawer-close" data-close="1" type="button" aria-label="关闭">
         <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
       </button>
       <div id="drawerContent"></div>
     </div>
   </aside>
 
   <script src="/app.js"></script>
 </body>
 </html>
